[package]
name = "intersection-lab"
default-run = "intersection-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
