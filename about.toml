# cargo-about configuration: generates THIRD_PARTY_LICENSES.md, the attribution file
# shipped with every binary package (see packaging/README.md).
# Licenses we accept, in order of preference when a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Only what ends up in the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
