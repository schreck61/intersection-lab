<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="899" height="375" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-size="16" font-weight="600" fill="#1f2933">One reservation zone, two movements</text>
<text x="20" y="50" font-size="12.5" fill="#57606a">Cars at 40 km/h on two through paths that cross at right angles, under the fail-safe gap. Each bar is the time one car holds the zone,</text>
<text x="20" y="67" font-size="12.5" fill="#57606a">from its front entering the 3.20 m zone to its rear leaving it (0.69 s).</text>
<line x1="200.0" y1="92" x2="200.0" y2="268" stroke="#d8dee4"/>
<text x="200.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">0 s</text>
<line x1="310.0" y1="92" x2="310.0" y2="268" stroke="#d8dee4"/>
<text x="310.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">1 s</text>
<line x1="420.0" y1="92" x2="420.0" y2="268" stroke="#d8dee4"/>
<text x="420.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">2 s</text>
<line x1="530.0" y1="92" x2="530.0" y2="268" stroke="#d8dee4"/>
<text x="530.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">3 s</text>
<line x1="640.0" y1="92" x2="640.0" y2="268" stroke="#d8dee4"/>
<text x="640.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">4 s</text>
<line x1="750.0" y1="92" x2="750.0" y2="268" stroke="#d8dee4"/>
<text x="750.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">5 s</text>
<line x1="860.0" y1="92" x2="860.0" y2="268" stroke="#d8dee4"/>
<text x="860.0" y="286" font-size="11" fill="#57606a" text-anchor="middle">6 s</text>
<text x="186" y="135" font-size="13" fill="#1f2933" text-anchor="end">S_T, northbound</text>
<rect x="200.0" y="117" width="76.2" height="26" rx="3" fill="#2c7a7b"/>
<text x="238.1" y="135" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">A1</text>
<rect x="310.6" y="117" width="76.2" height="26" rx="3" fill="#2c7a7b"/>
<text x="348.7" y="135" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">A2</text>
<rect x="421.1" y="117" width="76.2" height="26" rx="3" fill="#2c7a7b"/>
<text x="459.2" y="135" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">A3</text>
<text x="186" y="225" font-size="13" fill="#1f2933" text-anchor="end">E_T, westbound</text>
<rect x="654.2" y="207" width="76.2" height="26" rx="3" fill="#2b6cb0"/>
<text x="692.3" y="225" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">B1</text>
<rect x="764.7" y="207" width="76.2" height="26" rx="3" fill="#2b6cb0"/>
<text x="802.8" y="225" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">B2</text>
<path d="M200.0,108 V100 H310.6 V108" fill="none" stroke="#2c7a7b" stroke-width="1.4"/>
<text x="318.6" y="104" font-size="12" fill="#1f2933">1.00 s apart: following in the same lane, no gap needed</text>
<line x1="497.3" y1="172" x2="654.2" y2="172" stroke="#c53030" stroke-width="2"/>
<line x1="497.3" y1="166" x2="497.3" y2="178" stroke="#c53030" stroke-width="2"/>
<line x1="654.2" y1="166" x2="654.2" y2="178" stroke="#c53030" stroke-width="2"/>
<text x="662.2" y="168" font-size="12" fill="#c53030" font-weight="600">need(B1) = 1.43 s</text>
<text x="662.2" y="184" font-size="11.5" fill="#1f2933">0.2 s message latency + 0.3 s actuation</text>
<text x="662.2" y="199" font-size="11.5" fill="#1f2933">+ 0.93 s to cover its 10.3 m braking distance</text>
<line x1="614.4" y1="202" x2="614.4" y2="238" stroke="#57606a" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="614.4" y="252" font-size="11" fill="#57606a" text-anchor="middle">mitigated</text>
<line x1="552.3" y1="202" x2="552.3" y2="238" stroke="#57606a" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="552.3" y="252" font-size="11" fill="#57606a" text-anchor="middle">nominal</text>
<text x="20" y="318" font-size="12.2" fill="#1f2933">Switching movements costs 2.12 s from A3's entry to B1's; following in a lane costs 1.00 s. That is why the manager serves movements in batches.</text>
<text x="20" y="338" font-size="12.2" fill="#1f2933">Other gaps for a car at 40 km/h: mitigated 1.06 s, nominal 0.50 s. A truck or bus brakes at 4.5 m/s², so its fail-safe gap is 1.73 s.</text>
<text x="20" y="358" font-size="12.2" fill="#1f2933">The monitors measure what actually happens: PET is B1's actual entry minus A3's actual exit, and the margin is PET minus need(B1).</text>
</svg>
