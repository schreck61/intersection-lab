#
# Build and test on every platform, measure how much of the crate the tests run, build
# the browser version, check formatting and lint with clippy, build the crate from the
# files crates.io would get, check licenses, advisories and attributions, and fuzz the
# loading of weights files.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release --all-targets
      - run: cargo test --locked --release

  # The share of the crate's lines the tests run, every file counted: the app's panels
  # and the developer tools in src/bin too. Fails below 80%.
  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1
      # One test at a time: code built for coverage counts what it runs in counters every
      # thread updates, so threads running the same code at once slow one another down
      # many times over (tests/common/mod.rs).
      - run: cargo llvm-cov --locked --release --fail-under-lines 80 -- --test-threads=1

  web:
    name: Web (wasm32)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release --target wasm32-unknown-unknown --bin intersection-lab

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # Formatting (see rustfmt.toml): the crate, then the fuzz target, which is a
      # workspace of its own.
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo clippy --locked --release --target wasm32-unknown-unknown --bin intersection-lab -- -D warnings

  package:
    name: Crate package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Builds the app from only the files in Cargo.toml's include list, so a file the
      # build needs but the list leaves out fails here rather than when publishing.
      - run: cargo package --locked

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.1
      - name: cargo deny (licenses, advisories, bans, sources)
        run: cargo deny --locked check
      - name: THIRD_PARTY_LICENSES.md is up to date
        run: packaging/licenses.sh --check

  # The app reads weights files from disk, so whatever they contain must not crash it
  # (see fuzz/fuzz_targets/weights.rs).
  fuzz:
    name: Fuzz (weights)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly Rust; the pinned action takes the toolchain as an input.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      # Fuzz with the dependency versions the app is built with.
      - run: cp Cargo.lock fuzz/
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # One minute, starting from the small weights files in fuzz/seeds. New inputs go to
      # fuzz/corpus, which libFuzzer needs to exist.
      - run: |
          mkdir -p fuzz/corpus/weights
          cargo fuzz run weights fuzz/corpus/weights fuzz/seeds/weights -- -max_total_time=60
      # The input that crashed; `cargo +nightly fuzz run weights <file>` reproduces it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash
          path: fuzz/artifacts
          if-no-files-found: ignore
