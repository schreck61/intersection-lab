#
# Build signed installers for every platform and architecture and publish them as a
# draft GitHub Release when a version tag (v1.2.3) is pushed. Run it manually
# (workflow_dispatch) to build and download the artifacts without releasing.
#
# Signing is optional: each platform signs only when its secrets or variables are
# configured (see packaging/README.md), so the pipeline also works before certificates
# are set up. Windows signs only on tag builds (see the `release` environment below).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version, licenses and attributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.1
      - run: cargo deny --locked check licenses bans sources
      - run: packaging/licenses.sh --check

  macos:
    name: macOS (universal)
    needs: check
    runs-on: macos-14
    # The signing secrets live on the `release` environment (v* tags only); manual runs
    # build an ad-hoc signed, unnotarized DMG outside it.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Throwaway keychain, deleted at the end of the job.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # Sign by certificate hash, picking the team's Developer ID Application identity.
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="${TEAM_ID:+($TEAM_ID)}" '/Developer ID Application/ && (team == "" || index($0, team)) {print $2; exit}')
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the certificate"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: App Store Connect API key (notarization)
        if: env.SIGN == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, package
        env:
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: packaging/macos/package.sh
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    # Azure trusts this repository's OIDC token only from the `release` environment,
    # which is limited to v* tags; manual runs build unsigned packages outside it.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin intersection-lab
      - name: Azure login (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable (Azure Trusted Signing)
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          # Authenticate through the Azure CLI session from azure/login.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package (zip + MSI)
        shell: pwsh
        run: packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - name: Sign installer (Azure Trusted Signing)
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build and package (.deb, .rpm, .tar.gz)
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Intersection Lab ${GITHUB_REF_NAME#v}" --generate-notes
